<button (click)="openDialogTodo()">Создать задачу</button>
<div style="display: flex; flex-wrap: wrap;gap: 20px; margin-top: 100px;">
  <div *ngFor="let todo of todos$ | async">
    <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)" (editTodo)="openDialogTodo($event)"></app-todo-card>
  </div>
</div>
