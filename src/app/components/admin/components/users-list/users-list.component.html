<div class="cards__buttons">
  <button mat-raised-button (click)="openDialogEdit()" class="cards__create">Create User</button>
  <button (click)="deleteAll()" mat-raised-button class="cards__delete">Delete All Users</button>
  <button (click)="returnAll()" mat-raised-button>Return all Users</button>
  <input type="text" [(ngModel)]="username" matInput #inp (ngModelChange)="searchCardsByName(username)" placeholder="Enter Name">
  <p>{{inp.value}}</p>
</div>
<div class="cards">
  <div *ngFor="let user of users$ | async">
    <div>
      <app-user-card (editUser)="openDialogEdit($event)" [user]="user" (deleteUser)="deleteUser($event)"></app-user-card>
    </div>
  </div>
</div>
