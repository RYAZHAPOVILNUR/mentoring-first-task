<app-user-form (createUser)="createUser($event)"> </app-user-form>

<div class="container">
    <div *ngFor="let user of users$| async" class="item-cards__grid-left" style="display: flex;">
        <app-card [user]="user" (deleteUser)="deleteUser($event)" (editUser)="editUser($event)"></app-card>
    </div>
</div>
