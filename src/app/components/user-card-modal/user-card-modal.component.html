<h1 mat-dialog-title>
  {{ data.isEdit ? "Редактирование пользователя" : "Добавление пользователя" }}
</h1>
<form [formGroup]="reactiveForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <mat-form-field>
      <mat-label>Имя</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <br />
    <mat-form-field>
      <mat-label>Фамилия</mat-label>
      <input matInput formControlName="username" />
    </mat-form-field>
    <br />
    <mat-form-field>
      <mat-label>Почта</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>
    <br />
    <mat-form-field>
      <mat-label>Номер телефона</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()" type="button">Отмена</button>
    <button mat-button type="submit" [disabled]="!reactiveForm.valid">
      {{ data.isEdit ? "Сохранить" : "Добавить" }}
    </button>
  </mat-dialog-actions>
</form>
