<div class="card">
  <div class="card-name">{{user.name}}</div>
  <div class="card-id">{{user.username}}</div>
  <div class="card-phone">{{user.phone}}</div>
  <button class="card-btn" style="margin-right: 10px; background-color: #B3D2FD; padding: 5px" (click)="edit(user)">Редактировать</button>
  <button class="card-btn" style="background-color: red; padding: 5px" (click)="delete(user)">Удалить</button>
</div>
