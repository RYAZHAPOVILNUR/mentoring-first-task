<div class="create-edit-user-container">
  <form [formGroup]="cretaeEditForm" novalidate (ngSubmit)="onSubmitForm()">
    <mat-dialog-content>
      <h1>{{ isEdit ? 'Save ' : 'Create new ' }}user</h1>
      <mat-form-field class="create-edit-user-container__form-field">
        <mat-label>User Name</mat-label>
        <input matInput class="form-control" name="name" formControlName="name"/>
      </mat-form-field>
      <mat-form-field class="create-edit-user-container__form-field">
        <mat-label>Email</mat-label>
        <input matInput class="form-control" name="email" formControlName="email"/>  
      </mat-form-field>
      <mat-form-field class="create-edit-user-container__form-field">
        <mat-label>Phone</mat-label>
        <input matInput class="form-control" name="phone" formControlName="phone"/>
      </mat-form-field>
      <mat-form-field class="create-edit-user-container__form-field">
        <mat-label>Website</mat-label>
        <input matInput class="form-control" name="website" formControlName="website"/>
      </mat-form-field>
    </mat-dialog-content>
    <div class="create-edit-user-container__buttons">
      <button mat-raised-button (click)="onNoClickForm()">No Thanks</button>
      <button mat-raised-button class="btn btn-default" [mat-dialog-close]="cretaeEditForm.value" [disabled]="cretaeEditForm.invalid">{{ isEdit ? 'Save' : 'Create' }}</button>
    </div>
  </form>
</div>
