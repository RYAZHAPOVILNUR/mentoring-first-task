<button (click)="createTodo()">Создать задачу</button>
<div style="display: flex; flex-wrap: wrap;gap: 20px; margin-top: 100px;">
  <div *ngFor="let todo of todoService.todos$ | async">
    <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)" (editTodo)="editTodo($event)"></app-todo-card>
  </div>
</div>
