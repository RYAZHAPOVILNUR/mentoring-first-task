Компонент Списка Юзеров


<ul style="display: flex; flex-wrap: wrap;list-style: none; margin: 0 auto; gap: 20px">

  <li *ngFor="let user of users" style="width: 200px; height: 200px; border: 1px solid black; padding: 10px">
    <p [innerHTML]="user.name"></p>
    <p [innerHTML]="user.email"></p>
    <p [innerHTML]="user.website"></p>
    <p [innerHTML]="user.company.name"></p>
    <button (click)="deleteUser(user.id)">Delete User</button>
  </li>

</ul>
