<button
  mat-raised-button
  color="primary"
  type="submit"
  style="width: 150px"
  (click)="openDialog()"
>
  ДОБАВИТЬ ЮЗЕРА
</button>

<div style="display: flex; flex-wrap: wrap">
  <div *ngFor="let user of users$ | async">
    <app-user-card
      [user]="user"
      (deleteUser)="deleteUser($event)"
      (editUser)="openDialog(user)"
    ></app-user-card>
  </div>
</div>
