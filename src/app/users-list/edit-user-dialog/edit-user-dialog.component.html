<div class="dialog">
  <h2 class="dialog__title" mat-dialog-title>Edit user</h2>

  <div class="dialog__content" mat-dialog-content>
    <div class="dialog__form">
      <mat-form-field appearance="outline" class="dialog__field">
        <mat-label>Name</mat-label>
        <input matInput [formControl]="form.name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="dialog__field">
        <mat-label>Email</mat-label>
        <input matInput type="email" [formControl]="form.email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="dialog__field">
        <mat-label>Phone</mat-label>
        <input matInput [formControl]="form.phone" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="dialog__field">
        <mat-label>Website</mat-label>
        <input matInput [formControl]="form.website" />
      </mat-form-field>
    </div>
  </div>

  <div class="dialog__actions" mat-dialog-actions>
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="save()">Save</button>
  </div>
</div>
