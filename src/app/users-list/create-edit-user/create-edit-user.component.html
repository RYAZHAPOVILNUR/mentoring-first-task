<h2 mat-dialog-title>{{ data.isEdit ? "Edit User" : "Add User" }}</h2>

<div style="margin: 30px">
  <form class="example-form" [formGroup]="form" (ngSubmit)="submitForm()">
    <mat-form-field class="example-full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error>Некорректное значение имени</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <mat-error>Некорректное значение email</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Website</mat-label>
      <input matInput formControlName="website" />
      <mat-error>Некорректное значение website</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width" formGroupName="company">
      <mat-label>Company Name</mat-label>
      <input matInput formControlName="name" />
      <mat-error>Некорректное значение названия компании</mat-error>
    </mat-form-field>

    <ng-container *ngIf="data.isEdit; else elseButton">
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="form.invalid"
        style="width: 150px; margin-top: 20px"
      >
        EDIT USER
      </button>
    </ng-container>

    <ng-template #elseButton>
      <button
        mat-raised-button
        color="accent"
        type="submit"
        [disabled]="form.invalid"
        style="width: 150px; margin-top: 20px"
      >
        CREATE USER
      </button>
    </ng-template>
  </form>
</div>
