<img class="poster" src="/assets/Rectangle5.svg" alt="" />
<div class="cards-adv">
  <div class="adv-container">
    <div class="cards-adv-item">
      <div><img src="/assets/Maskgroup(1).svg" alt="" /></div>
      <div class="text">
        <div class="title">Большой ассортимент</div>
        <div class="child">строительных материалов всегда в наличии</div>
      </div>
    </div>
    <div class="cards-adv-item">
      <img src="/assets/Maskgroup(2).svg" alt="" />
      <div class="text">
        <div class="title">Доставка стройматериалов</div>
        <div class="child">
          в течении четырех часов или в любое удобное время
        </div>
      </div>
    </div>
    <div class="cards-adv-item">
      <img src="/assets/Maskgroup(3).svg" alt="" />
      <div class="text">
        <div class="child">
          Многоуровневая
          <span style="color: #000000"> система управления качеством</span> по
          стандарту ISO 9001
        </div>
      </div>
    </div>
  </div>
</div>

<div class="item-cards">
  <div class="item-cards__pagination">
    <button
      class="item-cards__pagination-button active-button"
      *ngFor="let newPage of newPages"
    >
      {{ newPage }}
    </button>
  </div>
</div>

<div class="grid">
  <div class="grid_1">
    <div class="item-cards__grid-left-text">
      Строительный отделочный инструмент
    </div>
    <div class="item-cards__grid-left-action">
      <span style="margin-right: 10px">Перейти в католог</span>
      <a class="item-cards__grid-left-action-link">
        <img src="/assets/Frame20.svg" alt="" />
      </a>
    </div>
  </div>
  <div class="grid_2">2</div>
  <div class="grid_3">3</div>
  <div class="grid_4">4</div>
  <div class="grid_5">5</div>
</div>
